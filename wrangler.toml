name = "grief-matters-cms"
main = "./worker/index.ts"
compatibility_flags = [ "nodejs_compat" ]
compatibility_date = "2026-05-21"
preview_urls = false
workers_dev = false
account_id = "bdd1337bc388d7f0a67c3f87cb4c5690"

[assets]
directory = "./dist/"
not_found_handling = "single-page-application"
binding = "ASSETS"

[vars]
SANITY_STUDIO_PROJECT_ID = "vg3sb730"
SANITY_STUDIO_DATASET = "production"
SANITY_STUDIO_API_VERSION = '2023-07-16'
AI_CONTENT_REVIEW_DOC_LIMIT = 10
AI_FLAGGED_REVIEW_DOC_LIMIT = 5
# Sized so worst-case content + system (~10K tok) + doc JSON (~3K tok) stays
# under ITPM (30K). Recompute if taxonomies grow significantly or the tier
# changes. Formula: (ITPM - system - doc - headroom) * 4 chars/token.
# this equates to around 8,000–12,000 words which should cover most scenarios
AI_CONTENT_REVIEW_CONTENT_MIN_CHARS = 250
AI_CONTENT_REVIEW_CONTENT_MAX_CHARS = 50000
# Minimum spacing between Anthropic requests, to keep cumulative input tokens
# under ITPM (30K/min). Formula: (per_request_input_tokens / ITPM) * 60_000.
# Applied per call, not per doc: scorable docs make two calls (review + score),
# each carrying the same uncached content. Cached system-prompt reads don't
# count toward ITPM, so uncached content (~12.5K tok at the cap) plus doc JSON
# dominates. At ~15K worst-case input post-cap, 30s is the floor. Raise for
# safety, lower if observed input_tokens consistently sit well below 15K. Keep
# DOC_LIMIT * 2 * gap comfortably inside the 10-minute review deadline in
# worker/ai-content-review/index.ts, or reviews get deferred each cycle.
AI_REVIEW_MIN_GAP_MS = 30000

[[kv_namespaces]]
binding = "AI_REVIEW_REPORTS"
id = "499ee3b1890b4da5964c9f69fe0c677d"
preview_id = "d0d84aaa578941fdb955bd0c4b59b4f1"

[triggers]
crons = ["0 */6 * * *", "0 1-5,7-11,13-17,19-23 * * *"]